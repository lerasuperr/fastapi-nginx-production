services:
  api:
    build: .
    container_name: api_gateway

    networks:
      - backend

    expose:
      - "8000"

    read_only: true

    tmpfs:
      - /tmp

    cap_drop:
      - ALL

    mem_limit: 512m
    cpus: "1.0"

    env_file:
      - .env

    restart: unless-stopped

    stop_grace_period: 30s

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  nginx:
    image: nginx:1.31.3
    container_name: nginx

    networks:
      - proxy
      - backend

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      api:
        condition: service_healthy

    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.13.2

    ports:
      - "127.0.0.1:9090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

    networks:
      - backend
      - monitoring
  
  grafana:
    image: grafana/grafana:12.1.1

    ports:
      - "127.0.0.1:3000:3000"

    volumes:
      - grafana_data:/var/lib/grafana

    networks:
      - monitoring

volumes:
  grafana_data:

networks:
  proxy:
    driver: bridge

  backend:
    driver: bridge
    internal: true

  monitoring:
    driver: bridge
